name: Veille accession aidee

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests pandas

      - name: Lancer la veille
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_DEST: ${{ secrets.MAIL_DEST }}
          MAIL_EXP: ${{ secrets.MAIL_EXP }}
          COMMUNES: "caluire,tassin,sainte-foy,saint-genis-laval,francheville,ecully,oullins,lyon"
          RFR: "29000"
          OCCUPANTS: "2"
          ZONE: "A"
          SALAIRE: "2570"
        run: python scripts/veille.py

      - name: Sauvegarder l'etat
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add etat/etat.json || true
          git diff --staged --quiet || git commit -m "veille: mise a jour de l'etat"
          git push || true
